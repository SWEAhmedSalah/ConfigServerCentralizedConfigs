spring:
  application:
    name: organization-service  # This MUST match your config file name in Git
  cloud:
    config:
      uri: http://localhost:8071  # Config Server URL
      profile: dev                # Active profile (dev, prod, etc.)
      label: main                 # Git branch
      fail-fast: true            # Fail if Config Server is unavailable
      retry:
        initial-interval: 1000
        max-attempts: 6
        max-interval: 2000
        multiplier: 1.1

  datasource:
    url: "jdbc:mysql://localhost:3307/ostock?useSSL=false&serverTimezone=UTC"
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  jpa:
    hibernate:
      ddl-auto: create
    show-sql: true

  sql:
    init:
      platform: mysql
      mode: always

eureka:
  instance:
    preferIpAddress: true
  client:
    registerWithEureka: true
    fetchRegistry: true
    serviceUrl:
      defaultZone: http://localhost:8070/eureka/
